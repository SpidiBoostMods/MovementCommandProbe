plugins { id 'fabric-loom' version '1.9.2' }
version = '1.3.0'
group = 'net.spidiboost'
base { archivesName = 'movement-command-probe-1.21.4' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:yarn:1.21.4+build.8:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.119.4+1.21.4'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
processResources { inputs.property 'version',project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
sourceSets { runtimeProbe {
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
} }
if(project.hasProperty('nativeProbe')){
    loom.mods { movement_command_probe { sourceSet sourceSets.main }; probe_fixture { sourceSet sourceSets.runtimeProbe } }
    loom.runs { verification {
        client(); source sourceSets.runtimeProbe; runDir 'build/native-verification'
        programArgs '--username','ProbeQA','--quickPlaySingleplayer','Probe-QA'
        if(System.getProperty('os.name').startsWith('Mac'))vmArg '-XstartOnFirstThread'
    } }
    tasks.named('runVerification') {
        doFirst {
            def options=file('build/native-verification/options.txt')
            options.parentFile.mkdirs()
            options.text='''onboardAccessibility:false
maxFps:60
soundCategory_master:0.0
'''
            file('build/native-verification/result.txt').delete()
        }
        doLast {
            def result=file('build/native-verification/result.txt')
            if(!result.isFile()||result.text.trim()!='PASS')throw new GradleException('Native probe did not complete')
        }
    }
}
